name: CodeQL

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  schedule:
    - cron: '42 18 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
          skip: true  # CodeQL does not yet support Kotlin 2.4.0 (requires < 2.3.30)

    steps:
    - name: Checkout repository
      if: ${{ !matrix.skip }}
      uses: actions/checkout@v6

    - name: Set up JDK 17
      if: ${{ !matrix.skip && matrix.build-mode == 'manual' }}
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      if: ${{ !matrix.skip && matrix.build-mode == 'manual' }}
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      if: ${{ !matrix.skip }}
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build project for CodeQL
      if: ${{ !matrix.skip && matrix.build-mode == 'manual' }}
      run: ./gradlew :xs2awizard:assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      if: ${{ !matrix.skip }}
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"