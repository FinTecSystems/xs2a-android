name: Record Screenshots

# Manually triggered to (re-)record golden screenshot images on a specific branch.
# Run this whenever an intentional UI change requires updating the golden baselines.
#
# Workflow:
#   1. Trigger this workflow targeting the branch that contains the UI change.
#   2. The workflow records new goldens on ubuntu-latest (matching the verify environment).
#   3. Updated images are committed back to the branch automatically.
#   4. The verify-screenshots CI job will then pass on the next push.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to record golden screenshots on'
        required: true
        default: 'develop'

jobs:
  record-screenshots:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}
          lfs: true

      # Ensure LFS smudge/clean filters are active so that newly generated PNGs are
      # stored as LFS pointers rather than plain binary blobs when committed.
      - name: Set up Git LFS
        run: git lfs install

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Record screenshot golden images
        run: ./gradlew recordRoborazziDebug -PrunScreenshotTests=true

      - name: Commit updated golden images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xs2awizard/src/test/snapshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore: update screenshot golden images [skip ci]"
            git push origin ${{ github.event.inputs.branch }}
          fi
